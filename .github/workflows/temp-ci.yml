name: Temporary validation

on:
  push:
    branches:
      - feature/layout-editor-interactions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore UltraPrint.sln
      - run: dotnet build UltraPrint.sln --configuration Release --no-restore
