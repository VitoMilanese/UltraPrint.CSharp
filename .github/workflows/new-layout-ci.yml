name: Temporary New Layout CI

on:
  push:
    branches:
      - feature/layout-editor-interactions-clean

jobs:
  build-and-compatibility-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore UltraPrint.sln
      - name: Build
        run: dotnet build UltraPrint.sln -c Release --no-restore
      - name: Compatibility tests
        run: dotnet run --project tests/UltraPrint.CompatibilityTests/UltraPrint.CompatibilityTests.csproj -c Release --no-build
